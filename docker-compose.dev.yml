services:
  backend:
    build: ./backend
    container_name: backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./BACKEND:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - shared_net

  frontend:
    image: node:20
    container_name: frontend
    working_dir: /app
    volumes:
      - ./FRONTEND:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    networks:
      - shared_net

  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - shared_net

networks:
  shared_net:
    external: false
